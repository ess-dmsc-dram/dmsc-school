name: deploy-book

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy book'
        required: true
        type: boolean
      linkcheck:
        description: 'Check links'
        default: true
        type: boolean

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
        with:
          msg: Apply automatic formatting

  build-book:
    needs: formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}  # required for conda env
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.72.0
          frozen: true

      - name: Build the book
        # Filter ipykernel warnings about encryption
        run: |
          pixi run build 2> >(grep -Fv "Kernel is running over TCP without encryption" >&2)

      - uses: actions/upload-pages-artifact@v5
        with:
          name: dmsc-school-book
          path: ./_build/html

      - name: Check links
        # Only run linkcheck on main branch or if requested by workflow_dispatch
        if: (github.event_name == 'push' && github.ref_name == 'main') || inputs.linkcheck
        run: |
          pixi run linkcheck
        continue-on-error: true  # We still want to deploy the book even if linkcheck fails

  deploy-book:
    needs: build-book
    runs-on: ubuntu-slim
    if: (github.event_name == 'push' && github.ref_name == 'main') || inputs.deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: dmsc-school-book
