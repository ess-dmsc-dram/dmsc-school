[workspace]
name = "dmsc-school"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
corner = ">=2.2"
dynesty = ">=2.1"
easydiffraction = ">=0.6"
easyscience = ">=1.3"
emcee = ">=3.1"
graphviz = ">=0.21"
h5py = ">=3.14"
ipympl = ">=0.9"
ipython = ">=8,<9"
ipywidgets = ">=8.1"
jupyter-book = ">=1,<2"
jupyterlab = ">=4.5"
jupyterquiz = ">=2.9"
matplotlib = ">=3.10"
mcstas = ">=3.5.35"
mcstasscript = ">=0.0.75"
mcstastox = ">=0.0.11"
mpltoolbox = ">=25.5.0"
numpy = ">=2.3"
pandas = ">=2.3"
plopp = ">=25.7"
# ply = ">=3.11"
pooch = ">=1.8"
pytest = ">=8.4"
pythreejs = ">=2.4"
scipp = ">=25.5"
scippneutron = ">=25.7"
scippnexus = ">=25.6"
scipy = ">=1.16"
scitacean = ">=25.8"
sphinxcontrib-mermaid = ">=1.0"

[system-requirements]
# Scipp does not support older OSX versions.
macos = "14.0"

[environments]
# default = { features = ["lint", "test"], solve-group = "default" }

[tasks.build]
cmd = "jupyter-book build -W --keep-going ."
description = "Build the book"
cwd = "./"

[tasks.linkcheck]
cmd = "jupyter-book build -W --keep-going --builder linkcheck ."
description = "Check links in the book"
cwd = "./"
